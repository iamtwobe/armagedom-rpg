{% extends "base.html" %}

{% block head %}

<style>
.iniciativa-tag {
    display: inline-block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #f0f0f0;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.25), rgba(211, 211, 211, 0.35));
    border: 1px solid rgba(185, 185, 185, 0.35);
    border-radius: 9999px;
    padding: 0.3rem 0.9rem;
    margin-top: 0.35rem;
    text-align: center;
    box-shadow: 0 0 8px rgba(99, 99, 99, 0.25);
    transition: all 0.25s ease;
}

.hp-box {
      position: relative;
      background: #2c2c2c;
      border-radius: 10px;
      overflow: hidden;
      width: 220px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
  }

.hp-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #dc3545, #ff7675);
      border-radius: 8px;
      transition: width 0.4s ease;
      z-index: 1;
  }

.hp-display {
      position: relative;
      z-index: 2;
      font-weight: 500;
      color: #e6e6e6;
      font-size: 0.95rem;
  }
</style>

{% endblock %}

{% block body %}
<div class="container py-4">
  <h1 class="text-light mb-4">Players</h1>

  <div class="players-grid">
    {% for ficha in fichas %}
    <div class="player-card" data-ficha-id="{{ ficha.id }}">
      <div class="player-info">
        <h5 class="username">{{ ficha.nome_personagem }}</h5>
        <div class="d-flex align-items-center gap-2 mt-2">
          <div class="hp-box">
            <div class="hp-bar"></div>
            <div class="hp-display">
              <span class="hp-atual">{{ ficha.vida_atual or 0 }}</span> /
              <span class="hp-max">{{ ficha.vida_maxima or 0 }}</span>
            </div>
          </div>
        </div>
        <h5 class="iniciativa-tag mt-2">
          Iniciativa
        </h5>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cards = document.querySelectorAll('.player-card');

  function updateHpBars(fichas) {
    fichas.forEach(f => {
      const card = document.querySelector(`.player-card[data-ficha-id="${f.id}"]`);
      if (!card) return;
      const hpAt = card.querySelector('.hp-atual');
      const hpMax = card.querySelector('.hp-max');
      const hpBar = card.querySelector('.hp-bar');
      
      const cur = parseInt(f.vida_atual || 0);
      const max = parseInt(f.vida_maxima || 0);
      const percent = max > 0 ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0;
      
      hpAt.textContent = cur;
      hpMax.textContent = max;
      hpBar.style.width = percent + "%";
    });
  }

  async function refresh() {
    try {
      const res = await fetch('/api/fichas/status');
      const fichas = await res.json();
      updateHpBars(fichas);
    } catch (e) {
      console.error('Erro ao atualizar HP:', e);
    }
  }

  setInterval(refresh, 15000);
  refresh();
});
</script>
{% endblock %}
