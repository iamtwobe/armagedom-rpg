{% extends 'base.html' %}

{% block body %}
    <section class="">
        <div class="container py-5 h-75">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-md-9 col-lg-7 col-xl-5">
              <div class="card" style="border-radius: 15px; background-color: white;">
                <div class="card-body p-4">
                  <div class="d-flex text-black">
                    <div class="flex-shrink-0">
                      <img src="{{ profile_picture }}"
                        alt="Generic placeholder image" class="img-fluid"
                        style="width: 180px; height: 180px; border-radius: 100px;">
                    </div>
                    <div class="flex-grow-1 ms-3 mt-3">
                      <h5 class="mb-1">@{{ current_user.username }}</h5>
                      <h6 class="mb-1 text-dark text-opacity-75">nome na ficha</h6>
                      <div class="d-flex justify-content-start rounded-3 p-1 mb-3 mt-3"
                        style="background-color: #efefef;">
                      </div>
                      <div class="d-flex pt-1">
                            <a href="{{ url_for('edit_profile') }}" class="flex-grow-1 w-100">
                                <button type="button" class="btn btn-outline-secondary me-1 flex-grow-1 w-100">Editar Perfil</button>
                            </a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
{% block form_edit_profile %}
{% endblock %}
{% endblock %}
